name: CI

on:
  push:
    branches: [main, claude/fetch-git-info-YNvye]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install root dependencies
        run: npm install --prefix packages/overmoderator || true

      - name: npm audit
        run: npm audit --production --audit-level=high --prefix packages/overmoderator || true

      - name: Print git info
        run: |
          echo "Commit: ${{ github.sha }}"
          echo "Branch: ${{ github.ref_name }}"
          echo "Build date: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
